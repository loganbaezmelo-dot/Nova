<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nova Assistant</title>
  <style>
    @property --gradient-angle {
      syntax: "<angle>";
      initial-value: 0deg;
      inherits: false;
    }

    body {
      background-color: #080c16;
      color: #f3f4f6;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
      overflow-x: hidden;
    }

    .orb {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      cursor: pointer;
      position: relative;
      background: conic-gradient(
        from var(--gradient-angle),
        #ec4899,
        #8b5cf6,
        #3b82f6,
        #06b6d4,
        #10b981,
        #ec4899
      );
      box-shadow: 0 0 45px rgba(139, 92, 246, 0.45);
      animation: rotateGradient 6s linear infinite;
      transition: transform 0.3s ease, box-shadow 0.3s ease, filter 0.3s ease;
      filter: blur(0.5px);
    }

    .orb::after {
      content: "";
      position: absolute;
      inset: 6px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, rgba(255, 255, 255, 0.35), transparent 70%);
      pointer-events: none;
    }

    /* Listening state: faster whirl & pulse */
    .orb.listening {
      animation: rotateGradient 2s linear infinite, pulseGlow 1.2s ease-in-out infinite alternate;
      box-shadow: 0 0 70px rgba(236, 72, 153, 0.85);
      filter: contrast(1.15) brightness(1.1);
    }

    /* Speaking state: rapid morphing glow */
    .orb.speaking {
      animation: rotateGradient 1.5s linear infinite, speakMorph 0.8s ease-in-out infinite alternate;
      box-shadow: 0 0 75px rgba(59, 130, 246, 0.9);
      filter: contrast(1.2) brightness(1.15);
    }

    @keyframes rotateGradient {
      to {
        --gradient-angle: 360deg;
      }
    }

    @keyframes pulseGlow {
      from {
        transform: scale(1.08);
      }
      to {
        transform: scale(1.24);
      }
    }

    @keyframes speakMorph {
      0% {
        transform: scale(1.05) rotate(0deg);
        border-radius: 50% 45% 55% 50%;
      }
      100% {
        transform: scale(1.18) rotate(5deg);
        border-radius: 48% 54% 46% 52%;
      }
    }

    #status {
      margin-top: 35px;
      font-size: 1.05rem;
      color: #9ca3af;
      max-width: 520px;
    }

    #response {
      margin-top: 15px;
      font-size: 1.25rem;
      font-weight: 500;
      color: #e0e7ff;
      max-width: 650px;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <div class="orb" id="mic-btn" title="Click to speak or cancel"></div>
  <div id="status">Tap the orb to speak. Tap anytime while it's talking to stop it.</div>
  <div id="response"></div>

  <script>
    const orb = document.getElementById('mic-btn');
    const statusText = document.getElementById('status');
    const responseText = document.getElementById('response');

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition;
    let isListening = false;

    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.lang = 'en-US';

      recognition.onstart = () => {
        isListening = true;
        orb.classList.add('listening');
        statusText.innerText = "Nova is listening...";
        responseText.innerText = "";
      };

      recognition.onend = () => {
        isListening = false;
        orb.classList.remove('listening');
      };

      recognition.onerror = (e) => {
        isListening = false;
        orb.classList.remove('listening');
        statusText.innerText = `Error: ${e.error}`;
      };

      recognition.onresult = async (event) => {
        const query = event.results[0][0].transcript.toLowerCase();
        statusText.innerText = `"${query}"`;
        await handleIntent(query);
      };
    } else {
      statusText.innerText = "Web Speech API not supported in this browser 😭. Try Chrome or Edge.";
    }

    orb.addEventListener('click', () => {
      if (window.speechSynthesis.speaking) {
        window.speechSynthesis.cancel();
        orb.classList.remove('speaking');
        statusText.innerText = "Stopped speaking.";
        return;
      }

      if (isListening && recognition) {
        recognition.stop();
        return;
      }

      if (recognition) {
        try {
          recognition.start();
        } catch (err) {
          recognition.stop();
        }
      }
    });

    function speak(text) {
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.rate = 1.0;
      utterance.pitch = 1.0;

      utterance.onstart = () => {
        orb.classList.add('speaking');
      };

      utterance.onend = () => {
        orb.classList.remove('speaking');
      };

      utterance.onerror = () => {
        orb.classList.remove('speaking');
      };

      window.speechSynthesis.speak(utterance);
      responseText.innerText = text;
    }

    function getWeatherDescription(code) {
      const descriptions = {
        0: "clear skies",
        1: "mostly clear skies",
        2: "partly cloudy skies",
        3: "overcast skies",
        45: "foggy weather",
        48: "rime fog",
        51: "light drizzle",
        53: "drizzle",
        55: "heavy drizzle",
        61: "light rain",
        63: "rain",
        65: "heavy downpours",
        71: "light snow",
        73: "steady snowfall",
        75: "heavy snow",
        80: "isolated rain showers",
        81: "moderate rain showers",
        82: "heavy rain showers",
        95: "thunderstorms"
      };
      return descriptions[code] || "fair conditions";
    }

    function textToNumber(val) {
      const words = { one: 1, two: 2, three: 3, four: 4, five: 5, six: 6, seven: 7, eight: 8, nine: 9, ten: 10 };
      return words[val] || parseInt(val, 10);
    }

    function parseRequestedDateOffsets(text) {
      const offsets = [];
      const weekdays = ["sunday", "monday", "tuesday", "wednesday", "thursday", "friday", "saturday"];
      const todayDay = new Date().getDay();

      // 1. Matches: "X days ago"
      const pastRegex = /(\b\d+|\bone|\btwo|\bthree|\bfour|\bfive|\bsix|\bseven|\beight|\bnine|\bten)\s+days?\s+ago/gi;
      let match;
      while ((match = pastRegex.exec(text)) !== null) {
        const num = textToNumber(match[1]);
        if (!isNaN(num)) offsets.push({ offset: -num, label: `${num} days ago` });
      }

      // 2. Matches: "yesterday"
      if (/\byesterday\b/i.test(text) && !offsets.some(o => o.offset === -1)) {
        offsets.push({ offset: -1, label: "yesterday" });
      }

      // 3. Matches: "in X days"
      const futureRegex = /in\s+(\b\d+|\bone|\btwo|\bthree|\bfour|\bfive|\bsix|\bseven|\beight|\bnine|\bten)\s+days?/gi;
      while ((match = futureRegex.exec(text)) !== null) {
        const num = textToNumber(match[1]);
        if (!isNaN(num)) offsets.push({ offset: num, label: `in ${num} days` });
      }

      // 4. Matches: "tomorrow"
      if (/\btomorrow\b/i.test(text) && !offsets.some(o => o.offset === 1)) {
        offsets.push({ offset: 1, label: "tomorrow" });
      }

      // 5. Matches: "last [day of week]" or "this [day of week]"
      weekdays.forEach((dayName, targetDayIndex) => {
        // "last friday"
        const lastRegex = new RegExp(`\\blast\\s+${dayName}\\b`, 'i');
        if (lastRegex.test(text)) {
          let diff = targetDayIndex - todayDay;
          if (diff >= 0) diff -= 7;
          if (!offsets.some(o => o.offset === diff)) {
            offsets.push({ offset: diff, label: `last ${dayName}` });
          }
        }

        // "next [weekday]"
        const nextRegex = new RegExp(`\\bnext\\s+${dayName}\\b`, 'i');
        if (nextRegex.test(text)) {
          let diff = targetDayIndex - todayDay;
          if (diff <= 0) diff += 7;
          if (!offsets.some(o => o.offset === diff)) {
            offsets.push({ offset: diff, label: `next ${dayName}` });
          }
        }
      });

      // 6. Matches: "today" or standalone check
      if (/\btoday\b/i.test(text) || /\bnow\b/i.test(text) || offsets.length === 0) {
        if (!offsets.some(o => o.offset === 0)) {
          offsets.push({ offset: 0, label: "today" });
        }
      }

      return offsets.sort((a, b) => a.offset - b.offset);
    }

    async function searchWikipedia(query) {
      let cleanTerm = query
        .replace(/^(what'?s|what is|who'?s|who was|who is|tell me about|explain|define|search for)\s+(a\s+|an\s+|the\s+)?/i, '')
        .replace(/[?.,!]/g, '')
        .trim();

      if (!cleanTerm) {
        speak("What would you like me to look up?");
        return;
      }

      speak(`Looking up ${cleanTerm}...`);

      try {
        const searchUrl = `https://en.wikipedia.org/w/api.php?action=query&generator=search&gsrsearch=${encodeURIComponent(cleanTerm)}&gsrlimit=1&prop=extracts&exintro=1&explaintext=1&exsentences=2&format=json&origin=*`;
        const res = await fetch(searchUrl);
        const data = await res.json();

        if (data.query && data.query.pages) {
          const pages = Object.values(data.query.pages);
          const firstResult = pages[0];

          if (firstResult && firstResult.extract) {
            speak(firstResult.extract);
            return;
          }
        }

        speak(`I couldn't find anything on Wikipedia for ${cleanTerm} 💀.`);
      } catch (err) {
        speak("I ran into an issue connecting to Wikipedia.");
      }
    }

    async function handleIntent(text) {
      const clean = text.replace(/[?.,!]/g, '').trim();

      // 1. Capabilities
      if (/^(what can you do|help|what are your features|commands|what do you do)\b/i.test(clean)) {
        speak("I can check current, past, and upcoming weather records, tell you the time and date, share jokes and advice, or look up information on Wikipedia 💀.");
        return;
      }

      // 2. Greetings
      if (/^(hey|hi|hello|what'?s up|yo|greetings|howdy|sup)\b/i.test(clean)) {
        const greetings = [
          "Hey! What's going on?",
          "Hello! How can I help you out?",
          "Yo! What's on your mind?",
          "Hey there! Ready whenever you are."
        ];
        const pick = greetings[Math.floor(Math.random() * greetings.length)];
        speak(pick);
        return;
      }

      // 3. Multi-Day & Weekday Weather Intent
      if (clean.includes('weather') || clean.includes('temperature') || clean.includes('rain') || clean.includes('forecast')) {
        speak("Checking those dates for you...");
        try {
          const lat = 28.5383;
          const lon = -81.3792;
          const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,precipitation,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,precipitation_sum&past_days=14&forecast_days=16&temperature_unit=fahrenheit&timezone=auto`;
          
          const res = await fetch(url);
          const data = await res.json();

          const targetOffsets = parseRequestedDateOffsets(clean);
          const timeArray = data.daily.time;
          const todayIndex = 14; 
          const reports = [];

          targetOffsets.forEach((req, i) => {
            const index = todayIndex + req.offset;
            if (index >= 0 && index < timeArray.length) {
              const maxT = Math.round(data.daily.temperature_2m_max[index]);
              const minT = Math.round(data.daily.temperature_2m_min[index]);
              const cond = getWeatherDescription(data.daily.weather_code[index]);
              const rainSum = data.daily.precipitation_sum[index];
              const rainProb = data.daily.precipitation_probability_max ? data.daily.precipitation_probability_max[index] : 0;

              let prefix = "";
              if (i > 0) {
                prefix = i === targetOffsets.length - 1 ? "And " : "Also, ";
              }

              if (clean.includes('rain')) {
                if (req.offset < 0) {
                  reports.push(`${prefix}${req.label} saw around ${rainSum} millimeters of rain.`);
                } else if (req.offset === 0) {
                  const precipNow = data.current.precipitation;
                  if (precipNow > 0) {
                    reports.push(`${prefix}it's currently raining with ${precipNow} millimeters of precipitation.`);
                  } else {
                    reports.push(`${prefix}it's dry right now, with a ${rainProb}% chance of rain today.`);
                  }
                } else {
                  reports.push(`${prefix}${req.label} there is a ${rainProb}% chance of rain with ${cond}.`);
                }
              } else {
                if (req.offset === 0) {
                  const currentTemp = Math.round(data.current.temperature_2m);
                  reports.push(`${prefix}right now it's ${currentTemp} degrees with ${cond}, reaching a high of ${maxT} degrees today.`);
                } else if (req.offset < 0) {
                  reports.push(`${prefix}${req.label} it reached a high of ${maxT} degrees and a low of ${minT} degrees with ${cond}.`);
                } else {
                  reports.push(`${prefix}${req.label} expect ${cond} with a high near ${maxT} degrees.`);
                }
              }
            }
          });

          if (reports.length > 0) {
            speak(reports.join(" "));
          } else {
            speak("I couldn't locate records for those dates.");
          }
        } catch (err) {
          speak("Sorry, I had trouble checking the weather timeline.");
        }
        return;
      }

      // 4. Time
      if (clean.includes('what time is it') || clean === 'time') {
        const now = new Date();
        speak(`It's currently ${now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}.`);
        return;
      }

      // 5. Date
      if (clean.includes('what is the date') || clean.includes('what day is it') || clean === 'date') {
        const now = new Date();
        speak(`Today is ${now.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' })}.`);
        return;
      }

      // 6. Joke
      if (clean.includes('joke')) {
        try {
          const res = await fetch('https://official-joke-api.appspot.com/random_joke');
          const data = await res.json();
          speak(`${data.setup} ... ${data.punchline}`);
        } catch (err) {
          speak("Why did the network cross the road? To reach the other domain.");
        }
        return;
      }

      // 7. Advice
      if (clean.includes('give me advice') || clean.includes('quote') || clean === 'advice') {
        try {
          const res = await fetch('https://api.adviceslip.com/advice');
          const data = await res.json();
          speak(data.slip.advice);
        } catch (err) {
          speak("Always backup your code before deploying.");
        }
        return;
      }

      // 8. Coin Toss
      if (clean.includes('flip a coin') || clean.includes('coin toss')) {
        const flip = Math.random() > 0.5 ? "Heads" : "Tails";
        speak(`It landed on ${flip}.`);
        return;
      }

      // 9. Identity
      if (clean.includes('who are you') || clean.includes('what is your name')) {
        speak("I am Nova, your client-side assistant. Zero cloud fees, zero Apple lawsuits 💀.");
        return;
      }

      // Fallback: Query Wikipedia
      await searchWikipedia(clean);
    }
  </script>
</body>
</html>
