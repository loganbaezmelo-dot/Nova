<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nova Assistant</title>
  <style>
    @property --gradient-angle {
      syntax: "<angle>";
      initial-value: 0deg;
      inherits: false;
    }

    body {
      background-color: #080c16;
      color: #f3f4f6;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
      overflow-x: hidden;
    }

    .orb {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      cursor: pointer;
      position: relative;
      background: conic-gradient(
        from var(--gradient-angle),
        #ec4899,
        #8b5cf6,
        #3b82f6,
        #06b6d4,
        #10b981,
        #ec4899
      );
      box-shadow: 0 0 45px rgba(139, 92, 246, 0.45);
      animation: rotateGradient 6s linear infinite;
      transition: transform 0.3s ease, box-shadow 0.3s ease, filter 0.3s ease;
      filter: blur(0.5px);
    }

    .orb::after {
      content: "";
      position: absolute;
      inset: 6px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, rgba(255, 255, 255, 0.35), transparent 70%);
      pointer-events: none;
    }

    /* Listening state: faster color whirl & breathing scale */
    .orb.listening {
      animation: rotateGradient 2s linear infinite, pulseGlow 1.2s ease-in-out infinite alternate;
      box-shadow: 0 0 70px rgba(236, 72, 153, 0.85);
      filter: contrast(1.15) brightness(1.1);
    }

    /* Speaking state: rapid morphing glow */
    .orb.speaking {
      animation: rotateGradient 1.5s linear infinite, speakMorph 0.8s ease-in-out infinite alternate;
      box-shadow: 0 0 75px rgba(59, 130, 246, 0.9);
      filter: contrast(1.2) brightness(1.15);
    }

    @keyframes rotateGradient {
      to {
        --gradient-angle: 360deg;
      }
    }

    @keyframes pulseGlow {
      from {
        transform: scale(1.08);
      }
      to {
        transform: scale(1.24);
      }
    }

    @keyframes speakMorph {
      0% {
        transform: scale(1.05) rotate(0deg);
        border-radius: 50% 45% 55% 50%;
      }
      100% {
        transform: scale(1.18) rotate(5deg);
        border-radius: 48% 54% 46% 52%;
      }
    }

    #status {
      margin-top: 35px;
      font-size: 1.05rem;
      color: #9ca3af;
      max-width: 520px;
    }

    #response {
      margin-top: 15px;
      font-size: 1.25rem;
      font-weight: 500;
      color: #e0e7ff;
      max-width: 650px;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <div class="orb" id="mic-btn" title="Click to speak or cancel"></div>
  <div id="status">Tap the orb to speak. Tap anytime while it's talking to stop it.</div>
  <div id="response"></div>

  <script>
    const orb = document.getElementById('mic-btn');
    const statusText = document.getElementById('status');
    const responseText = document.getElementById('response');

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition;
    let isListening = false;

    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.lang = 'en-US';

      recognition.onstart = () => {
        isListening = true;
        orb.classList.add('listening');
        statusText.innerText = "Nova is listening...";
        responseText.innerText = "";
      };

      recognition.onend = () => {
        isListening = false;
        orb.classList.remove('listening');
      };

      recognition.onerror = (e) => {
        isListening = false;
        orb.classList.remove('listening');
        statusText.innerText = `Error: ${e.error}`;
      };

      recognition.onresult = async (event) => {
        const query = event.results[0][0].transcript.toLowerCase();
        statusText.innerText = `"${query}"`;
        await handleIntent(query);
      };
    } else {
      statusText.innerText = "Web Speech API not supported in this browser 😭. Try Chrome or Edge.";
    }

    // Orb Click Handler
    orb.addEventListener('click', () => {
      // 1. If talking, cancel speech immediately
      if (window.speechSynthesis.speaking) {
        window.speechSynthesis.cancel();
        orb.classList.remove('speaking');
        statusText.innerText = "Stopped speaking.";
        return;
      }

      // 2. If listening, toggle off
      if (isListening && recognition) {
        recognition.stop();
        return;
      }

      // 3. Otherwise, listen
      if (recognition) {
        try {
          recognition.start();
        } catch (err) {
          recognition.stop();
        }
      }
    });

    function speak(text) {
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.rate = 1.0;
      utterance.pitch = 1.0;

      utterance.onstart = () => {
        orb.classList.add('speaking');
      };

      utterance.onend = () => {
        orb.classList.remove('speaking');
      };

      utterance.onerror = () => {
        orb.classList.remove('speaking');
      };

      window.speechSynthesis.speak(utterance);
      responseText.innerText = text;
    }

    function getWeatherDescription(code) {
      const descriptions = {
        0: "clear skies",
        1: "mainly clear skies",
        2: "partly cloudy skies",
        3: "overcast skies",
        45: "foggy conditions",
        48: "depositing rime fog",
        51: "light drizzle",
        53: "moderate drizzle",
        55: "dense drizzle",
        61: "slight rain",
        63: "moderate rain",
        65: "heavy rain",
        71: "slight snow fall",
        73: "moderate snow fall",
        75: "heavy snow fall",
        80: "slight rain showers",
        81: "moderate rain showers",
        82: "violent rain showers",
        95: "a thunderstorm"
      };
      return descriptions[code] || "fair conditions";
    }

    async function searchWikipedia(query) {
      let cleanTerm = query
        .replace(/^(what'?s|what is|who'?s|who was|who is|tell me about|explain|define|search for)\s+(a\s+|an\s+|the\s+)?/i, '')
        .replace(/[?.,!]/g, '')
        .trim();

      if (!cleanTerm) {
        speak("What would you like me to look up?");
        return;
      }

      speak(`Looking up ${cleanTerm}...`);

      try {
        const searchUrl = `https://en.wikipedia.org/w/api.php?action=query&generator=search&gsrsearch=${encodeURIComponent(cleanTerm)}&gsrlimit=1&prop=extracts&exintro=1&explaintext=1&exsentences=2&format=json&origin=*`;
        const res = await fetch(searchUrl);
        const data = await res.json();

        if (data.query && data.query.pages) {
          const pages = Object.values(data.query.pages);
          const firstResult = pages[0];

          if (firstResult && firstResult.extract) {
            speak(firstResult.extract);
            return;
          }
        }

        speak(`Sorry, I couldn't find anything on Wikipedia for ${cleanTerm} 💀.`);
      } catch (err) {
        speak("I ran into an issue connecting to Wikipedia.");
      }
    }

    async function handleIntent(text) {
      const clean = text.replace(/[?.,!]/g, '').trim();

      // 1. Casual Greetings & Acknowledgments
      if (/^(hey|hi|hello|what'?s up|yo|greetings|howdy|sup)\b/i.test(clean)) {
        const greetings = [
          "Hey! What's up?",
          "Hello! How can I help you today?",
          "Yo! What are we checking out?",
          "Hey there! Ready when you are."
        ];
        const pick = greetings[Math.floor(Math.random() * greetings.length)];
        speak(pick);
        return;
      }

      // 2. Weather & Rain Intent
      if (clean.includes('weather') || clean.includes('temperature') || clean.includes('rain')) {
        speak("Checking current skies...");
        try {
          const lat = 28.5383;
          const lon = -81.3792;
          const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,precipitation,weather_code&hourly=precipitation_probability&temperature_unit=fahrenheit`);
          const data = await res.json();
          
          const temp = Math.round(data.current.temperature_2m);
          const precip = data.current.precipitation;
          const code = data.current.weather_code;
          const condition = getWeatherDescription(code);
          const prob = (data.hourly && data.hourly.precipitation_probability) ? data.hourly.precipitation_probability[0] : 0;

          if (clean.includes('rain')) {
            if (precip > 0 || (code >= 51 && code <= 67) || (code >= 80 && code <= 82)) {
              speak(`Yes, it is currently raining with ${precip} millimeters of precipitation.`);
            } else if (prob > 30) {
              speak(`It's not raining right now, but there is a ${prob}% chance of rain in the forecast.`);
            } else {
              speak("Nope, it is completely dry right now.");
            }
          } else {
            speak(`It is currently ${temp} degrees Fahrenheit with ${condition}.`);
          }
        } catch (err) {
          speak("Sorry, I couldn't reach the weather service.");
        }
        return;
      }

      // 3. Current Time
      if (clean.includes('what time is it') || clean === 'time') {
        const now = new Date();
        speak(`It is ${now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}.`);
        return;
      }

      // 4. Current Date
      if (clean.includes('what is the date') || clean.includes('what day is it') || clean === 'date') {
        const now = new Date();
        speak(`Today is ${now.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' })}.`);
        return;
      }

      // 5. Random Joke
      if (clean.includes('joke')) {
        try {
          const res = await fetch('https://official-joke-api.appspot.com/random_joke');
          const data = await res.json();
          speak(`${data.setup} ... ${data.punchline}`);
        } catch (err) {
          speak("Why did the network cross the road? To reach the other domain.");
        }
        return;
      }

      // 6. Random Advice
      if (clean.includes('give me advice') || clean.includes('quote') || clean === 'advice') {
        try {
          const res = await fetch('https://api.adviceslip.com/advice');
          const data = await res.json();
          speak(data.slip.advice);
        } catch (err) {
          speak("Always backup your code before deploying.");
        }
        return;
      }

      // 7. Coin Toss
      if (clean.includes('flip a coin') || clean.includes('coin toss')) {
        const flip = Math.random() > 0.5 ? "Heads" : "Tails";
        speak(`It landed on ${flip}.`);
        return;
      }

      // 8. Identity check
      if (clean.includes('who are you') || clean.includes('what is your name')) {
        speak("I am Nova, your client-side assistant. Zero cloud fees, zero Apple lawsuits 💀.");
        return;
      }

      // Fallback: Query Wikipedia
      await searchWikipedia(clean);
    }
  </script>
</body>
</html>
